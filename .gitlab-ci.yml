
# HR: Popis CI faza i njihov redoslijed izvođenja.
# EN: List of CI stages and their execution order.
stages:
  - test

# HR: Zajednički predložak dohvaća najnovije ovisnosti i pokreće provjere.
# EN: Shared template resolves the latest dependencies and runs checks.
.test-template:
  tags:
    - APPTESTAAIHREDUDOCKER
  stage: test
  variables:
    XDEBUG_MODE: "coverage"
    COMPOSER_AUTH: >
      {
        "gitlab-token": {
          "gitlab.srce.hr": "${CI_JOB_TOKEN}"
        }
      }
  script:
    - echo "Running tests for PHP with image tag ${PHP_IMAGE_TAG}..."
    - php scripts/build_ci_composer.php
    - COMPOSER=composer.ci.json composer update --with-all-dependencies --no-interaction --no-progress --no-ansi --prefer-dist --optimize-autoloader --ignore-platform-reqs
    - COMPOSER=composer.ci.json composer on-commit
    # HR: Kontejner mora stvarno izvršiti privilegirani test; preskakanje je greška.
    # EN: The container must actually run the privileged test; skipping is a failure.
    - php scripts/verify_root_asset_permissions.php
  coverage: '/^\s*Lines:\s*\d+.\d+\%/'
  artifacts:
    when: always
    reports:
      coverage_report:
        coverage_format: cobertura
        path: build/logs/cobertura.xml
      junit: build/logs/junit.xml
    paths:
      - build/logs/clover.xml
      - build/coverage/html

# HR: Testna matrica pokriva sve podržane PHP verzije.
# EN: The test matrix covers all supported PHP versions.
test-php:
  extends: .test-template
  image: cicnavi/dap:${PHP_IMAGE_TAG}
  parallel:
    matrix:
      - PHP_IMAGE_TAG: ["82", "83", "84", "08"]

# HR: Zasebno provjerava da svaki minimalni skup modula radi iz čiste instalacije.
# EN: Separately verifies every minimal module set from a clean installation.
clean-install-sqlite:
  tags:
    - APPTESTAAIHREDUDOCKER
  stage: test
  image: cicnavi/dap:08
  variables:
    COMPOSER_AUTH: >
      {
        "gitlab-token": {
          "gitlab.srce.hr": "${CI_JOB_TOKEN}"
        }
      }
  script:
    - php scripts/build_ci_composer.php
    - COMPOSER=composer.ci.json composer update --with-all-dependencies --no-interaction --no-progress --no-ansi --prefer-dist --optimize-autoloader --ignore-platform-reqs
    - php scripts/verify_clean_install_matrix.php
