# EN: Non-root HTTP listener; only public/ is served. Private runtime paths have no URL alias.
# The optional /saml alias serves only a compatible read-only SimpleSAMLphp public directory.
# HR: HTTP sluša bez roota; poslužuje se samo public/. Privatni runtime nema URL alias.
# Opcionalni /saml alias poslužuje samo kompatibilni read-only SimpleSAMLphp public direktorij.
ServerName localhost
<VirtualHost *:8080>
    # EN: FallbackResource does not use public/.htaccess; retain Bearer/CalDAV credentials for PHP.
    # HR: FallbackResource ne koristi public/.htaccess; zadržati Bearer/CalDAV vjerodajnice za PHP.
    SetEnvIfNoCase Authorization "(.+)" HTTP_AUTHORIZATION=$1
    DocumentRoot /opt/simbioza/public
    <Directory /opt/simbioza/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        FallbackResource /index.php
    </Directory>
    Alias /saml /opt/simplesamlphp/public
    <Directory /opt/simplesamlphp/public>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
