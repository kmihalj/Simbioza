; EN: Sessions are persistent data; uploads/runtime scratch are ephemeral tmpfs.
; HR: Sesije su trajni podatak; uploadi/radne privremene datoteke su tmpfs.
session.save_path=/runtime/data/sessions
upload_tmp_dir=/tmp
sys_temp_dir=/tmp
upload_max_filesize=256M
post_max_size=257M
memory_limit=512M
expose_php=Off
display_errors=Off
log_errors=On
error_log=/proc/self/fd/2
opcache.enable=1
opcache.validate_timestamps=0
