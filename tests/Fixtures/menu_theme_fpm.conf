; EN: Isolated, named synthetic test pools only, with no changes to the system pools.
;
; HR: Samo izolirani, imenovani sintetički testni poolovi, bez promjena sistemskih poolova.
[global]
pid = /srv/simbioza-config-test/run/fpm.pid
error_log = /srv/simbioza-config-test/run/fpm.log
daemonize = yes

[p7-normal]
user = www-data
group = www-data
listen = 127.0.0.1:19081
pm = static
pm.max_children = 1
clear_env = yes

[p7-secure]
user = www-data
group = www-data
listen = 127.0.0.1:19082
pm = static
pm.max_children = 1
clear_env = yes
