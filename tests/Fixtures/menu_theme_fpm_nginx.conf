# EN: Synthetic localhost endpoints only; no changes to installed nginx sites.
#
# HR: Samo sintetički localhost endpointi; bez promjena instaliranih nginx siteova.
pid /srv/simbioza-config-test/run/nginx.pid;
error_log /srv/simbioza-config-test/run/nginx.log;
events {}
http {
    access_log /srv/simbioza-config-test/run/access.log;
    server {
        listen 127.0.0.1:18081;
        root /srv/simbioza-config-test/normal/public;
        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:19081;
        }
    }
    server {
        listen 127.0.0.1:18082;
        root /srv/simbioza-config-test/secure/public;
        location ~ \.php$ {
            include /etc/nginx/fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_pass 127.0.0.1:19082;
        }
    }
}
