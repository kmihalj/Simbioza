# HR: Samo lokalni Colima test, bez javnog listenera.
# EN: Local Colima test only, without a public listener.
server {
    listen 127.0.0.1:18081;
    root /srv/simbioza-config-test/normal/public;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.3-fpm.sock;
    }
}
server {
    listen 127.0.0.1:18082;
    root /srv/simbioza-config-test/secure/public;
    location / { try_files $uri $uri/ /index.php?$query_string; }
    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9077;
    }
}
