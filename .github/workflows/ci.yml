name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Check out application
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, fileinfo, filter, json, libxml, mbstring, openssl, pdo, pdo_sqlite, simplexml, tokenizer, xmlwriter, zip
          coverage: pcov

      - name: Validate Composer metadata
        run: composer validate --strict

      - name: Install locked Git dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Check platform requirements
        run: composer check-platform-reqs

      - name: Run quality and test suite
        run: composer on-commit
