name: CI

on:
  push:
    branches:
      - main
    tags:
      - '*'
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # EN: Native images are tested/scanned before the stable multi-architecture tag exists.
  #
  # HR: Nativni imagei testiraju se/skeniraju prije objave stabilnog višeplatformskog taga.
  docker-images:
    name: Docker ${{ matrix.arch }}
    if: github.event_name != 'pull_request'
    needs: [release-metadata, quality, clean-install-sqlite, clean-install-network-databases, browser-and-api-e2e, postgresql-e2e, mysql-e2e]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      REGISTRY_IMAGE: ghcr.io/kmihalj/simbioza
      SIMBIOZA_IMAGE: simbioza:ci
      SIMBIOZA_COOKIE_SECURE: '0'
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: dom, mbstring, pdo_sqlite, zip
          coverage: none
      - name: Resolve published packages and export sanitized context
        run: |
          echo "IMAGE_VERSION=$(tr -d '[:space:]' < VERSION)" >> "$GITHUB_ENV"
          php scripts/build_ci_composer.php
          COMPOSER=composer.ci.json composer update --no-interaction --no-progress --prefer-dist
          mkdir -p build/docker
          php scripts/build_container_context.php --output=build/docker/context
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build native image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: build/docker/context
          file: build/docker/context/docker/Dockerfile
          platforms: linux/${{ matrix.arch }}
          load: true
          tags: simbioza:ci
          build-args: |
            VERSION=${{ env.IMAGE_VERSION }}
            REVISION=${{ github.sha }}
      - name: Fresh PostgreSQL installation, persistence and immutable-code checks
        working-directory: docker
        env:
          SIMBIOZA_DB_PASSWORD_FILE: ${{ runner.temp }}/private-secrets/database_password
          SIMBIOZA_DB_ADMIN_PASSWORD_FILE: ${{ runner.temp }}/private-secrets/database_admin_password
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/private-secrets"
          openssl rand -hex 32 > "$SIMBIOZA_DB_PASSWORD_FILE"
          openssl rand -hex 32 > "$SIMBIOZA_DB_ADMIN_PASSWORD_FILE"
          chmod 0444 "$SIMBIOZA_DB_PASSWORD_FILE" "$SIMBIOZA_DB_ADMIN_PASSWORD_FILE"
          docker compose -p simbioza-release-ci run --rm --no-deps init
          docker compose -p simbioza-release-ci up -d --wait database
          docker compose -p simbioza-release-ci run --rm --no-deps --entrypoint php -v "$GITHUB_WORKSPACE/tests/Fixtures/container_probe.php:/tmp/probe.php:ro" app /tmp/probe.php install
          docker compose -p simbioza-release-ci run --rm --no-deps app migrate
          docker compose -p simbioza-release-ci up -d --wait app
          curl --fail --silent --output /dev/null http://127.0.0.1:1511/
          for mode in seed guards backup languages; do
            docker compose -p simbioza-release-ci exec -T app php /dev/stdin "$mode" < ../tests/Fixtures/container_probe.php
          done
          docker compose -p simbioza-release-ci exec -T app php /dev/stdin state < ../tests/Fixtures/container_probe.php > ../build/docker/state-before.json
          docker compose -p simbioza-release-ci up -d --force-recreate --wait app
          docker compose -p simbioza-release-ci exec -T app php /dev/stdin state < ../tests/Fixtures/container_probe.php > ../build/docker/state-after.json
          cmp ../build/docker/state-before.json ../build/docker/state-after.json
          docker compose -p simbioza-release-ci exec -T app php /dev/stdin < ../scripts/verify_release_dependencies.php
          docker compose -p simbioza-release-ci cp app:/opt/simbioza/composer.lock ../build/docker/composer.lock
      - name: Record all vulnerability findings
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: simbioza:ci
          format: json
          output: build/docker/vulnerabilities.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '0'
      # EN: Fixable high/critical vulnerabilities block publication; full findings remain visible.
      #
      # HR: Popravljive visoke/kritične ranjivosti blokiraju objavu; potpuni nalazi ostaju vidljivi.
      - name: Block fixable high and critical vulnerabilities
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: simbioza:ci
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - name: Record SBOM
        uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
        with:
          image-ref: simbioza:ci
          format: cyclonedx
          output: build/docker/sbom.json
          exit-code: '0'
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested candidate by commit identity
        if: github.ref_type == 'tag'
        run: |
          image="$REGISTRY_IMAGE:candidate-$GITHUB_SHA-${{ matrix.arch }}"
          docker tag simbioza:ci "$image"
          docker push "$image"
          docker inspect --format '{{json .RepoDigests}}' "$image" > build/docker/digests.json
      - name: Upload image evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docker-${{ matrix.arch }}
          path: |
            build/docker/composer.lock
            build/docker/vulnerabilities.json
            build/docker/sbom.json
            build/docker/digests.json
            build/docker/state-before.json
            build/docker/state-after.json
          retention-days: 30
      - name: Clean only the isolated CI Compose project
        if: always()
        working-directory: docker
        env:
          SIMBIOZA_DB_PASSWORD_FILE: ${{ runner.temp }}/private-secrets/database_password
          SIMBIOZA_DB_ADMIN_PASSWORD_FILE: ${{ runner.temp }}/private-secrets/database_admin_password
        run: docker compose -p simbioza-release-ci down --volumes

  docker-publish:
    name: Publish Docker manifest and release bundle
    if: github.ref_type == 'tag'
    needs: [docker-images]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/download-artifact@v4
        with:
          pattern: docker-*
          path: build/docker-evidence
      - name: Publish only the two verified architectures
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          docker buildx imagetools create \
            -t "ghcr.io/kmihalj/simbioza:$VERSION" \
            "ghcr.io/kmihalj/simbioza:candidate-$GITHUB_SHA-amd64" \
            "ghcr.io/kmihalj/simbioza:candidate-$GITHUB_SHA-arm64"
          docker buildx imagetools inspect "ghcr.io/kmihalj/simbioza:$VERSION" > build/docker-evidence/image-manifest.txt
          mkdir -p build/release-bundle/docker build/release-bundle/docs
          cp docker/compose.yaml docker/compose.saml.yaml docker/.env.example docker/postgres-init.sh build/release-bundle/docker/
          cp docs/*.md build/release-bundle/docs/
          tar -czf "build/simbioza-$VERSION-docker.tar.gz" -C build/release-bundle .
          tar -czf "build/simbioza-$VERSION-docker-evidence.tar.gz" -C build/docker-evidence .
          cd build
          sha256sum "simbioza-$VERSION-docker.tar.gz" "simbioza-$VERSION-docker-evidence.tar.gz" > SHA256SUMS
      # EN: Assets attach to a draft; publication follows manual CI/registry verification.
      #
      # HR: Datoteke se prilažu draftu; objava slijedi ručnu provjeru CI-ja/registra.
      - name: Attach bundles to draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ github.ref_name }}
        run: |
          gh release view "$VERSION" --json isDraft --jq '.isDraft' | grep -qx true
          gh release upload "$VERSION" "build/simbioza-$VERSION-docker.tar.gz" "build/simbioza-$VERSION-docker-evidence.tar.gz" build/SHA256SUMS

  release-metadata:
    name: Release metadata / Metapodaci izdanja
    runs-on: ubuntu-latest

    steps:
      - name: Check out application / Dohvati aplikaciju
        uses: actions/checkout@v5

      - name: Verify VERSION and release tag / Provjeri VERSION i tag izdanja
        shell: bash
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must contain one stable semantic version / VERSION mora sadržavati jednu stabilnu semantičku verziju: $version" >&2
            exit 1
          fi

          if [[ "$RELEASE_REF_TYPE" == "tag" ]]; then
            tag_version="${RELEASE_REF_NAME#v}"
            if [[ "$tag_version" != "$version" ]]; then
              echo "Release tag and VERSION differ / Tag izdanja i VERSION se razlikuju: $RELEASE_REF_NAME != $version" >&2
              exit 1
            fi
          fi

  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Check out application / Dohvati aplikaciju
        uses: actions/checkout@v5

      - name: Set up PHP / Postavi PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, fileinfo, filter, json, libxml, mbstring, openssl, pcntl, pdo, pdo_sqlite, posix, simplexml, tokenizer, xmlwriter, zip
          coverage: pcov

      - name: Validate Composer metadata / Provjeri Composer metapodatke
        run: |
          php scripts/build_ci_composer.php
          COMPOSER=composer.ci.json composer validate --strict

      - name: Resolve latest dependencies / Dohvati najnovije ovisnosti
        run: COMPOSER=composer.ci.json composer update --with-all-dependencies --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Check platform requirements / Provjeri platformske preduvjete
        run: COMPOSER=composer.ci.json composer check-platform-reqs

      # EN: Parse generated pools, including no override layers; no FPM service is started by the check.
      #
      # HR: Parsira generirane poolove, uključujući rad bez dodatnih slojeva; provjera ne pokreće FPM servis.
      - name: Verify real FPM configuration parser / Provjeri stvarni FPM parser konfiguracije
        run: |
          docker run --rm --entrypoint php \
            -v "$GITHUB_WORKSPACE:/source:ro" "php:${{ matrix.php }}-fpm" \
            /source/scripts/verify_fpm_pool_configuration.php --php-fpm=/usr/local/sbin/php-fpm

      - name: Run quality and test suite / Pokreni provjere i testove
        run: |
          COMPOSER=composer.ci.json composer on-commit

      # EN: Root runs only the test against temporary files on this isolated runner.
      #
      # HR: Root izvodi samo test na privremenim datotekama ovog izoliranog runnera.
      - name: Verify cross-user ownership / Provjeri vlasništvo između korisnika
        if: matrix.php == '8.5'
        run: |
          sudo -n "$(command -v php)" scripts/verify_root_asset_permissions.php
          sudo -n "$(command -v php)" scripts/verify_updater_permissions.php

  clean-install-sqlite:
    name: Clean module matrix / Čista matrica modula
    runs-on: ubuntu-latest

    steps:
      - name: Check out application / Dohvati aplikaciju
        uses: actions/checkout@v5

      - name: Set up PHP / Postavi PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, dom, fileinfo, filter, json, libxml, mbstring, openssl, pdo, pdo_sqlite, simplexml, tokenizer, xmlwriter, zip
          coverage: none

      - name: Resolve verifier dependencies / Dohvati ovisnosti alata
        run: |
          php scripts/build_ci_composer.php
          COMPOSER=composer.ci.json composer update --with-all-dependencies --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Verify clean module combinations / Provjeri čiste kombinacije modula
        run: php scripts/verify_clean_install_matrix.php

  clean-install-network-databases:
    name: Clean PostgreSQL and MySQL / Čisti PostgreSQL i MySQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: heartphrame_matrix
          POSTGRES_USER: heartphrame_matrix
          POSTGRES_PASSWORD: matrix-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:latest
        env:
          MYSQL_DATABASE: heartphrame_matrix
          MYSQL_USER: heartphrame_matrix
          MYSQL_PASSWORD: matrix-secret
          MYSQL_ROOT_PASSWORD: matrix-root-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h localhost -uroot -pmatrix-root-secret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out application / Dohvati aplikaciju
        uses: actions/checkout@v5

      - name: Set up PHP / Postavi PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, dom, fileinfo, filter, json, libxml, mbstring, openssl, pdo, pdo_mysql, pdo_pgsql, simplexml, tokenizer, xmlwriter, zip
          coverage: none

      - name: Resolve verifier dependencies / Dohvati ovisnosti alata
        run: |
          php scripts/build_ci_composer.php
          COMPOSER=composer.ci.json composer update --with-all-dependencies --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Verify PostgreSQL clean installation / Provjeri čistu PostgreSQL instalaciju
        env:
          HPH_MATRIX_DB_HOST: 127.0.0.1
          HPH_MATRIX_DB_PORT: 5432
          HPH_MATRIX_DB_NAME: heartphrame_matrix
          HPH_MATRIX_DB_USER: heartphrame_matrix
          HPH_MATRIX_DB_PASSWORD: matrix-secret
        run: php scripts/verify_clean_install_matrix.php --case=all --database=pgsql

      - name: Verify MySQL clean installation / Provjeri čistu MySQL instalaciju
        env:
          HPH_MATRIX_DB_HOST: 127.0.0.1
          HPH_MATRIX_DB_PORT: 3306
          HPH_MATRIX_DB_NAME: heartphrame_matrix
          HPH_MATRIX_DB_USER: heartphrame_matrix
          HPH_MATRIX_DB_PASSWORD: matrix-secret
        run: php scripts/verify_clean_install_matrix.php --case=all --database=mysql

  browser-and-api-e2e:
    name: Browser and API E2E / Browser i API E2E
    runs-on: ubuntu-latest

    steps:
      - name: Check out application / Dohvati aplikaciju
        uses: actions/checkout@v5

      - name: Set up PHP / Postavi PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, dom, fileinfo, filter, json, libxml, mbstring, openssl, pdo, pdo_sqlite, simplexml, tokenizer, xmlwriter, zip
          coverage: none

      - name: Set up latest Node.js / Postavi najnoviji Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest

      - name: Resolve latest PHP dependencies / Dohvati najnovije PHP ovisnosti
        run: |
          php scripts/build_ci_composer.php
          COMPOSER=composer.ci.json composer update --with-all-dependencies --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Resolve latest browser-test dependency / Dohvati najnoviju browser-test ovisnost
        run: npm install --no-package-lock

      - name: Install Chromium / Instaliraj Chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser and API scenarios / Pokreni izolirane browser i API scenarije
        run: php scripts/run_e2e.php

      - name: Upload E2E diagnostics / Spremi E2E dijagnostiku
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hfclean-e2e-diagnostics
          path: |
            build/playwright-report
            build/test-results
            build/e2e-server.log
            build/e2e-query-log.jsonl
            build/e2e-request-log.jsonl
          if-no-files-found: ignore
          retention-days: 14

  postgresql-e2e:
    name: PostgreSQL E2E
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: heartphrame_e2e
          POSTGRES_USER: heartphrame_e2e
          POSTGRES_PASSWORD: e2e-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out application / Dohvati aplikaciju
        uses: actions/checkout@v5

      - name: Set up PHP / Postavi PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, dom, fileinfo, filter, json, libxml, mbstring, openssl, pdo, pdo_pgsql, simplexml, tokenizer, xmlwriter, zip
          coverage: none

      - name: Set up latest Node.js / Postavi najnoviji Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest

      - name: Resolve latest PHP dependencies / Dohvati najnovije PHP ovisnosti
        run: |
          php scripts/build_ci_composer.php
          COMPOSER=composer.ci.json composer update --with-all-dependencies --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Resolve latest browser-test dependency / Dohvati najnoviju browser-test ovisnost
        run: npm install --no-package-lock

      - name: Install Chromium / Instaliraj Chromium
        run: npx playwright install --with-deps chromium

      - name: Run PostgreSQL browser, API, and performance E2E / Pokreni PostgreSQL E2E
        env:
          HPH_MATRIX_DB_HOST: 127.0.0.1
          HPH_MATRIX_DB_PORT: 5432
          HPH_MATRIX_DB_NAME: heartphrame_e2e
          HPH_MATRIX_DB_USER: heartphrame_e2e
          HPH_MATRIX_DB_PASSWORD: e2e-secret
        run: php scripts/run_e2e.php --database=pgsql

      - name: Upload PostgreSQL E2E diagnostics / Spremi PostgreSQL E2E dijagnostiku
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hfclean-postgresql-e2e-diagnostics
          path: |
            build/playwright-report
            build/test-results
            build/e2e-server-*.log
            build/e2e-query-log-*.jsonl
            build/e2e-request-log-*.jsonl
          if-no-files-found: ignore
          retention-days: 14

  mysql-e2e:
    name: MySQL E2E
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:latest
        env:
          MYSQL_DATABASE: heartphrame_e2e
          MYSQL_USER: heartphrame_e2e
          MYSQL_PASSWORD: e2e-secret
          MYSQL_ROOT_PASSWORD: e2e-root-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h localhost -uroot -pe2e-root-secret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out application / Dohvati aplikaciju
        uses: actions/checkout@v5

      - name: Set up PHP / Postavi PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, dom, fileinfo, filter, json, libxml, mbstring, openssl, pdo, pdo_mysql, simplexml, tokenizer, xmlwriter, zip
          coverage: none

      - name: Set up latest Node.js / Postavi najnoviji Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest

      - name: Resolve latest PHP dependencies / Dohvati najnovije PHP ovisnosti
        run: |
          php scripts/build_ci_composer.php
          COMPOSER=composer.ci.json composer update --with-all-dependencies --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Resolve latest browser-test dependency / Dohvati najnoviju browser-test ovisnost
        run: npm install --no-package-lock

      - name: Install Chromium / Instaliraj Chromium
        run: npx playwright install --with-deps chromium

      - name: Run MySQL browser, API, and performance E2E / Pokreni MySQL E2E
        env:
          HPH_MATRIX_DB_HOST: 127.0.0.1
          HPH_MATRIX_DB_PORT: 3306
          HPH_MATRIX_DB_NAME: heartphrame_e2e
          HPH_MATRIX_DB_USER: heartphrame_e2e
          HPH_MATRIX_DB_PASSWORD: e2e-secret
        run: php scripts/run_e2e.php --database=mysql

      - name: Upload MySQL E2E diagnostics / Spremi MySQL E2E dijagnostiku
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hfclean-mysql-e2e-diagnostics
          path: |
            build/playwright-report
            build/test-results
            build/e2e-server-*.log
            build/e2e-query-log-*.jsonl
            build/e2e-request-log-*.jsonl
          if-no-files-found: ignore
          retention-days: 14
