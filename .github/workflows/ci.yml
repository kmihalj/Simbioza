name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Check out application / Dohvati aplikaciju
        uses: actions/checkout@v5

      - name: Set up PHP / Postavi PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: ctype, dom, fileinfo, filter, json, libxml, mbstring, openssl, pdo, pdo_sqlite, simplexml, tokenizer, xmlwriter, zip
          coverage: pcov

      - name: Validate Composer metadata / Provjeri Composer metapodatke
        run: composer validate --strict

      - name: Resolve latest dependencies / Dohvati najnovije ovisnosti
        run: composer update --with-all-dependencies --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Check platform requirements / Provjeri platformske preduvjete
        run: composer check-platform-reqs

      - name: Run quality and test suite / Pokreni provjere i testove
        run: composer on-commit

  clean-install-sqlite:
    name: Clean module matrix / Čista matrica modula
    runs-on: ubuntu-latest

    steps:
      - name: Check out application / Dohvati aplikaciju
        uses: actions/checkout@v5

      - name: Set up PHP / Postavi PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, dom, fileinfo, filter, json, libxml, mbstring, openssl, pdo, pdo_sqlite, simplexml, tokenizer, xmlwriter, zip
          coverage: none

      - name: Resolve verifier dependencies / Dohvati ovisnosti alata
        run: composer update --with-all-dependencies --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Verify clean module combinations / Provjeri čiste kombinacije modula
        run: composer clean-matrix

  clean-install-network-databases:
    name: Clean PostgreSQL and MySQL / Čisti PostgreSQL i MySQL
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        env:
          POSTGRES_DB: heartphrame_matrix
          POSTGRES_USER: heartphrame_matrix
          POSTGRES_PASSWORD: matrix-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      mysql:
        image: mysql:latest
        env:
          MYSQL_DATABASE: heartphrame_matrix
          MYSQL_USER: heartphrame_matrix
          MYSQL_PASSWORD: matrix-secret
          MYSQL_ROOT_PASSWORD: matrix-root-secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent -h localhost -uroot -pmatrix-root-secret"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Check out application / Dohvati aplikaciju
        uses: actions/checkout@v5

      - name: Set up PHP / Postavi PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, dom, fileinfo, filter, json, libxml, mbstring, openssl, pdo, pdo_mysql, pdo_pgsql, simplexml, tokenizer, xmlwriter, zip
          coverage: none

      - name: Resolve verifier dependencies / Dohvati ovisnosti alata
        run: composer update --with-all-dependencies --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Verify PostgreSQL clean installation / Provjeri čistu PostgreSQL instalaciju
        env:
          HPH_MATRIX_DB_HOST: 127.0.0.1
          HPH_MATRIX_DB_PORT: 5432
          HPH_MATRIX_DB_NAME: heartphrame_matrix
          HPH_MATRIX_DB_USER: heartphrame_matrix
          HPH_MATRIX_DB_PASSWORD: matrix-secret
        run: php scripts/verify_clean_install_matrix.php --case=all --database=pgsql

      - name: Verify MySQL clean installation / Provjeri čistu MySQL instalaciju
        env:
          HPH_MATRIX_DB_HOST: 127.0.0.1
          HPH_MATRIX_DB_PORT: 3306
          HPH_MATRIX_DB_NAME: heartphrame_matrix
          HPH_MATRIX_DB_USER: heartphrame_matrix
          HPH_MATRIX_DB_PASSWORD: matrix-secret
        run: php scripts/verify_clean_install_matrix.php --case=all --database=mysql

  browser-and-api-e2e:
    name: Browser and API E2E / Browser i API E2E
    runs-on: ubuntu-latest

    steps:
      - name: Check out application / Dohvati aplikaciju
        uses: actions/checkout@v5

      - name: Set up PHP / Postavi PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: ctype, dom, fileinfo, filter, json, libxml, mbstring, openssl, pdo, pdo_sqlite, simplexml, tokenizer, xmlwriter, zip
          coverage: none

      - name: Set up latest Node.js / Postavi najnoviji Node.js
        uses: actions/setup-node@v5
        with:
          node-version: latest

      - name: Resolve latest PHP dependencies / Dohvati najnovije PHP ovisnosti
        run: composer update --with-all-dependencies --no-interaction --no-progress --prefer-dist --optimize-autoloader

      - name: Resolve latest browser-test dependency / Dohvati najnoviju browser-test ovisnost
        run: npm install --no-package-lock

      - name: Install Chromium / Instaliraj Chromium
        run: npx playwright install --with-deps chromium

      - name: Run isolated browser and API scenarios / Pokreni izolirane browser i API scenarije
        run: composer e2e

      - name: Upload E2E diagnostics / Spremi E2E dijagnostiku
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: hfclean-e2e-diagnostics
          path: |
            build/playwright-report
            build/test-results
            build/e2e-server.log
          if-no-files-found: ignore
          retention-days: 14
